# The whole office reaches the service from one external IP, so this per-IP
# limit only stops floods; wrong passwords are limited per account in the backend.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=120r/m;

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 25m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  root /usr/share/nginx/html;
  index index.html;
  location ^~ /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 30s; }
  location ^~ /api/auth/ { limit_req zone=auth_limit burst=60 nodelay; limit_req_status 429; error_page 429 = @auth_flood; proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 30s; }
  location @auth_flood { default_type application/json; charset utf-8; return 429 '{"detail":"Слишком много запросов. Подождите минуту и повторите"}'; }
  location ~* \.(js|css|png|jpg|jpeg|svg|woff2?|ttf)$ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
